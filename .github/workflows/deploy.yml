name: Deploy JOHNNY TEC × NASHEED to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build & Prepare Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json found. Installing with npm ci..."
            npm ci || npm install --legacy-peer-deps
          else
            echo "No package-lock.json found. Installing with npm install..."
            npm install --legacy-peer-deps
          fi

      - name: Preserve & Sync Repository Music & Covers
        run: |
          mkdir -p public/assets/music public/assets/covers
          if [ -d "assets/music" ]; then
            cp -r assets/music/* public/assets/music/ 2>/dev/null || true
          fi
          if [ -d "assets/covers" ]; then
            cp -r assets/covers/* public/assets/covers/ 2>/dev/null || true
          fi

      - name: Build Application with Vite
        run: npm run build

      - name: Prevent Jekyll Static File Processing
        run: touch dist/.nojekyll

      - name: Setup GitHub Pages Configuration
        uses: actions/configure-pages@v5

      - name: Upload Build Output Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
